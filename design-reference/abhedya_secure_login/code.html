<h1 class="font-headline-md text-headline-md text-primary tracking-tight mb-space-xs">

<!-- Authentication Form -->
<form class="flex flex-col space-y-space-lg relative z-10" onsubmit="event.preventDefault();">

</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[18px]">fingerprint</span>
</div>
<input autocomplete="username" class="w-full bg-surface-container-low pl-10 pr-4 py-3 rounded font-body-md text-body-md text-primary placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest shadow-sm transition-all duration-200" id="identifier" name="identifier" placeholder="e.g. m.adams@vault.internal" required="" type="text"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col space-y-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-primary uppercase tracking-wider" for="password">
              Secret Passkey
            </label>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors tracking-wide underline-offset-4 hover:underline" type="button">

<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-secondary">

</div>
</div>
</div>
</div>
<script>
  (function initAuthInteractions() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');
    const demoBtn = document.getElementById('demo-user-btn');
    const identInput = document.getElementById('identifier');

    if (toggleBtn && pwdInput && toggleIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (demoBtn && identInput && pwdInput) {
      demoBtn.addEventListener('click', () => {
        identInput.value = 'analyst.guest@abhedya.legal';
        pwdInput.value = '••••••••••••';
        demoBtn.classList.add('bg-surface-container-high');
        setTimeout(() => {
          demoBtn.classList.remove('bg-surface-container-high');
        }, 300);
      });
    }
  })();
