<!-- Subtle Concentric Fingerprint Watermark Element -->
<div class="relative w-full max-w-lg">
<div class="absolute -top-16 -left-16 w-56 h-56 pointer-events-none opacity-40">
<svg class="w-full h-full text-outline-variant" fill="none" viewbox="0 0 200 200">
<circle cx="100" cy="100" r="30" stroke="currentColor" stroke-dasharray="2 4" stroke-width="0.75"></circle>
<circle cx="100" cy="100" r="54" stroke="currentColor" stroke-width="0.75"></circle>
<circle cx="100" cy="100" r="78" stroke="currentColor" stroke-dasharray="4 6" stroke-width="0.75"></circle>
<circle cx="100" cy="100" r="102" stroke="currentColor" stroke-width="0.75"></circle>
</svg>
</div>
<!-- Main Dossier Shell Card -->
<div class="relative bg-surface-container-lowest shadow-md rounded-xl p-space-lg md:p-space-xl">
<!-- Archival Header Meta Ledger -->
<div class="flex items-center justify-between pb-space-md mb-space-lg bg-surface-container-low px-space-md py-space-xs rounded-lg">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider flex items-center gap-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-secondary"></span>
          SYS.LOCALE // 01-A
        </span>
<span class="font-label-sm text-label-sm text-on-surface-variant">STEP 01 OF 04</span>
</div>
<!-- Editorial Typography Section -->
<div class="space-y-space-xs mb-space-xl">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">
          Choose your language
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
          Select the language you are most comfortable using.
        </p>
</div>
<!-- Language Selection Stack -->
<fieldset class="space-y-space-sm mb-space-xl" id="locale-options">
<legend class="sr-only">Language options</legend>
<!-- Option 1: English (Selected State by Default) -->
<label class="group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-150 bg-secondary-container/20 shadow-sm" data-locale-card="" for="locale-en">
<input checked="" class="sr-only peer" id="locale-en" name="preferred_locale" type="radio" value="en"/>
<div class="flex flex-col min-w-0 pr-space-md">
<span class="font-title-md text-title-md text-primary tracking-tight">
              English
            </span>
<span class="font-label-md text-label-md text-secondary mt-0.5">
              International English
            </span>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full bg-primary-container text-surface transition-transform duration-150 peer-checked:scale-100 scale-95 flex-shrink-0">
<span class="material-symbols-outlined text-[16px] leading-none">check</span>
</div>
</label>
<!-- Option 2: Hindi -->
<label class="group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-150 bg-surface-container-low hover:bg-surface-container" data-locale-card="" for="locale-hi">
<input class="sr-only peer" id="locale-hi" name="preferred_locale" type="radio" value="hi"/>
<div class="flex flex-col min-w-0 pr-space-md">
<span class="font-title-md text-title-md text-on-surface tracking-tight" lang="hi">
              हिन्दी
            </span>
<span class="font-label-md text-label-md text-on-surface-variant mt-0.5">
              Hindi
            </span>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent peer-checked:bg-primary-container peer-checked:text-surface transition-all flex-shrink-0">
<span class="material-symbols-outlined text-[16px] leading-none">check</span>
</div>
</label>
<!-- Option 3: Marathi -->
<label class="group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-150 bg-surface-container-low hover:bg-surface-container" data-locale-card="" for="locale-mr">
<input class="sr-only peer" id="locale-mr" name="preferred_locale" type="radio" value="mr"/>
<div class="flex flex-col min-w-0 pr-space-md">
<span class="font-title-md text-title-md text-on-surface tracking-tight" lang="mr">
              मराठी
            </span>
<span class="font-label-md text-label-md text-on-surface-variant mt-0.5">
              Marathi
            </span>
</div>
<div class="flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent peer-checked:bg-primary-container peer-checked:text-surface transition-all flex-shrink-0">
<span class="material-symbols-outlined text-[16px] leading-none">check</span>
</div>
</label>
</fieldset>
<!-- Action Panel -->
<div class="space-y-space-md pt-space-xs">
<button class="w-full h-12 flex items-center justify-center gap-space-xs bg-primary-container hover:bg-primary active:scale-[0.99] text-surface font-title-sm text-title-sm rounded-lg shadow-sm transition-all duration-150 group" id="btn-continue" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-150 group-hover:translate-x-0.5">
            arrow_forward
          </span>
</button>
<!-- Contextual Reassurance / Guard Note -->
<div class="flex items-start gap-space-sm px-space-xs py-space-xs">
<span class="material-symbols-outlined text-secondary text-[18px] mt-0.5 flex-shrink-0">
            verified_user
          </span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
            You can update your language preferences anytime from Workspace Settings.
          </p>
</div>
</div>
</div>
<!-- Forensic Registry Metadata Footer -->
<div class="flex items-center justify-between mt-space-md px-space-sm text-on-surface-variant/70">
<span class="font-label-sm text-label-sm uppercase tracking-widest">ENCL. SECURE PROFILE INGEST</span>
<span class="font-label-sm text-label-sm font-mono tracking-tighter">RFC 5646 COMPLIANT</span>
</div>
</div>
<script>
    (function initLocaleSelector() {
      const cards = document.querySelectorAll('[data-locale-card]');
      const radios = document.querySelectorAll('input[name="preferred_locale"]');

      function updateVisuals() {
        radios.forEach(radio => {
          const card = radio.closest('label');
          const title = card.querySelector('span:first-child');
          const sub = card.querySelector('span:nth-child(2)');
          const iconContainer = card.querySelector('div:last-child');

          if (radio.checked) {
            card.classList.remove('bg-surface-container-low', 'hover:bg-surface-container');
            card.classList.add('bg-secondary-container/20', 'shadow-sm');
            title.classList.remove('text-on-surface');
            title.classList.add('text-primary');
            sub.classList.remove('text-on-surface-variant');
            sub.classList.add('text-secondary');
            iconContainer.classList.remove('bg-surface-container-highest', 'text-transparent');
            iconContainer.classList.add('bg-primary-container', 'text-surface');
          } else {
            card.classList.remove('bg-secondary-container/20', 'shadow-sm');
            card.classList.add('bg-surface-container-low', 'hover:bg-surface-container');
            title.classList.remove('text-primary');
            title.classList.add('text-on-surface');
            sub.classList.remove('text-secondary');
            sub.classList.add('text-on-surface-variant');
            iconContainer.classList.remove('bg-primary-container', 'text-surface');
            iconContainer.classList.add('bg-surface-container-highest', 'text-transparent');
          }
        });
      }

      radios.forEach(radio => {
        radio.addEventListener('change', updateVisuals);
      });

      const continueBtn = document.getElementById('btn-continue');
      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          const selected = document.querySelector('input[name="preferred_locale"]:checked')?.value;
          continueBtn.classList.add('opacity-90');
          setTimeout(() => continueBtn.classList.remove('opacity-90'), 200);
        });
      }
    })();
  </script>
</div></main></body></html>
